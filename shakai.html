<title>日本地方たんけんクイズ</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap');

  :root{
    --bg:#f6f1e4;
    --paper:#fffdf7;
    --ink:#2c3320;
    --ink-soft:#5b6247;
    --green:#5f7d43;
    --green-deep:#3f5a2c;
    --brown:#a9764c;
    --brown-deep:#7c5433;
    --accent:#e8783f;
    --accent-deep:#c25c26;
    --blue:#3f6fa0;
    --ok:#3f8d4f;
    --ok-bg:#e5f3e2;
    --ng:#c04a3a;
    --ng-bg:#fbe6e1;
    --line: rgba(44,51,32,0.12);
    --shadow: 0 10px 24px -12px rgba(60,45,20,0.28);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1b2016;
      --paper:#242a1d;
      --ink:#ece6d4;
      --ink-soft:#b9c0a4;
      --green:#8fb56b;
      --green-deep:#a9d385;
      --brown:#cf9c6c;
      --brown-deep:#e3b788;
      --accent:#f2955c;
      --accent-deep:#ffb583;
      --blue:#7fb0e0;
      --ok:#7fce8f;
      --ok-bg:#213524;
      --ng:#e78474;
      --ng-bg:#3a2320;
      --line: rgba(236,230,212,0.14);
      --shadow: 0 10px 26px -12px rgba(0,0,0,0.55);
    }
  }
  :root[data-theme="dark"]{
    --bg:#1b2016;
    --paper:#242a1d;
    --ink:#ece6d4;
    --ink-soft:#b9c0a4;
    --green:#8fb56b;
    --green-deep:#a9d385;
    --brown:#cf9c6c;
    --brown-deep:#e3b788;
    --accent:#f2955c;
    --accent-deep:#ffb583;
    --blue:#7fb0e0;
    --ok:#7fce8f;
    --ok-bg:#213524;
    --ng:#e78474;
    --ng-bg:#3a2320;
    --line: rgba(236,230,212,0.14);
    --shadow: 0 10px 26px -12px rgba(0,0,0,0.55);
  }

  *{box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', 'Hiragino Sans', 'Noto Sans JP', sans-serif;
    padding-inline:16px;
    padding-block:24px;
    min-height:100%;
    display:flex;
    justify-content:center;
  }
  .app{ width:100%; max-width:560px; display:flex; flex-direction:column; gap:16px; }

  h1,h2,h3{ font-family:'Zen Maru Gothic', 'Zen Kaku Gothic New', sans-serif; margin:0; text-wrap:balance; }

  .topbar{
    display:flex; align-items:baseline; justify-content:space-between; gap:8px;

  .topbar .kicker{

  }
  .title{
    font-size:22px; font-weight:900; color:var(--green-deep);
  }

  .card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:20px;
    padding:20px;
    box-shadow:var(--shadow);
  }

  /* ---------- HOME SCREEN ---------- */
  .home-lead{ color:var(--ink-soft); font-size:14px; line-height:1.7; }
  .stat-row{

  }
  .stat{
    background:var(--bg); border:1px solid var(--line); border-radius:14px;
    padding:10px 8px; text-align:center;
  }
  .stat .n{ font-size:20px; font-weight:900; font-variant-numeric:tabular-nums; color:var(--green-deep); }
  .stat .l{ font-size:11px; color:var(--ink-soft); margin-top:2px; }

  .section-label{
    font-size:12px; font-weight:700; color:var(--ink-soft); letter-spacing:.06em;
    margin:4px 2px 0;
  }

  .week-chart{
    display:flex; align-items:flex-end; gap:8px; height:76px; margin-top:14px; padding:0 2px;
  }
  .week-chart .col{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
    height:100%; gap:5px;
  }
  .week-chart .bar-track{
    width:100%; max-width:26px; height:52px; display:flex; align-items:flex-end;
    border-radius:6px; background:var(--bg); border:1px solid var(--line); overflow:hidden;
  }
  .week-chart .bar-fill{
    width:100%; border-radius:5px 5px 0 0; background:var(--line); transition:height .25s ease;
  }
  .week-chart .bar-fill.has-data{ background:var(--green); }
  .week-chart .bar-fill.today{ background:var(--accent); }
  .week-chart .dow{ font-size:10.5px; color:var(--ink-soft); font-weight:700; }
  .week-chart .col.today .dow{ color:var(--accent-deep); }

  .mode-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .mode-btn{
    appearance:none; border:2px solid var(--line); background:var(--paper);
    border-radius:16px; padding:14px 10px; text-align:left; cursor:pointer;
    display:flex; flex-direction:column; gap:4px; color:var(--ink);
    font-family:inherit;
  }
  .mode-btn .emoji{ font-size:22px; }
  .mode-btn .name{ font-weight:900; font-size:15px; }
  .mode-btn .desc{ font-size:11.5px; color:var(--ink-soft); line-height:1.4; }
  .mode-btn[aria-pressed="true"]{
    border-color:var(--green); background:var(--ok-bg); color:var(--green-deep);
  }
  .mode-btn[aria-pressed="true"] .desc{ color:var(--green-deep); opacity:.8; }

  .chip-wrap{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{
    appearance:none; border:1.5px solid var(--line); background:var(--paper);
    color:var(--ink); border-radius:999px; padding:8px 14px; font-size:13px;
    cursor:pointer; font-weight:700; font-family:inherit;
  }
  .chip[aria-pressed="true"]{ background:var(--green); border-color:var(--green); color:#fff; }
  .chip .cnt{ opacity:.7; font-weight:500; }

  .weak-btn{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    width:100%; border:2px solid var(--accent); background:var(--paper);
    border-radius:16px; padding:14px 16px; cursor:pointer; font-family:inherit;
    color:var(--accent-deep);
  }
  .weak-btn strong{ font-size:15px; }
  .weak-btn span.sub{ display:block; font-size:11.5px; color:var(--ink-soft); font-weight:500; margin-top:2px; }
  .weak-btn .badge{
    background:var(--accent); color:#fff; font-weight:900; font-size:13px;
    border-radius:12px; padding:4px 10px; font-variant-numeric:tabular-nums; flex:none; text-align:center;
  }
  .weak-btn:disabled{ opacity:.4; cursor:not-allowed; }

  .start-btn{
    appearance:none; border:none; border-radius:16px; padding:16px;

    font-size:17px; font-weight:900; cursor:pointer; letter-spacing:.02em;
    box-shadow: 0 8px 18px -6px rgba(232,120,63,0.55);
  }
  .start-btn:active{ transform:translateY(1px); }

  /* ---------- QUIZ SCREEN ---------- */
  .progress-row{ display:flex; align-items:center; gap:10px; }
  .progress-track{
    flex:1; height:8px; background:var(--line); border-radius:999px; overflow:hidden;
  }
  .progress-fill{ height:100%; background:var(--green); border-radius:999px; transition:width .3s ease; }
  .progress-num{ font-size:12px; font-weight:700; color:var(--ink-soft); font-variant-numeric:tabular-nums; flex:none; }

  .quiz-card{ display:flex; flex-direction:column; gap:14px; }
  .cat-tag{
    align-self:flex-start; font-size:11px; font-weight:900; letter-spacing:.05em;
    color:var(--brown-deep); background:var(--bg); border:1px solid var(--line);
    border-radius:999px; padding:4px 10px;
  }
  .question-text{ font-size:19px; font-weight:700; line-height:1.6; }

  .choice-grid{ display:grid; grid-template-columns:1fr; gap:10px; }
  .choice-btn{
    appearance:none; text-align:left; border:2px solid var(--line); background:var(--paper);
    color:var(--ink); border-radius:14px; padding:13px 16px; font-size:15.5px; font-weight:700;
    cursor:pointer; font-family:inherit; display:flex; gap:10px; align-items:center;
  }
  .choice-btn .idx{
    flex:none; width:24px; height:24px; border-radius:50%; background:var(--bg);
    display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:900;
    color:var(--ink-soft);
  }
  .choice-btn:disabled{ cursor:default; }
  .choice-btn.correct{ border-color:var(--ok); background:var(--ok-bg); color:var(--ok); }
  .choice-btn.correct .idx{ background:var(--ok); color:#fff; }
  .choice-btn.wrong{ border-color:var(--ng); background:var(--ng-bg); color:var(--ng); }
  .choice-btn.wrong .idx{ background:var(--ng); color:#fff; }
  .choice-btn.dim{ opacity:.45; }

  .write-box textarea{
    width:100%; min-height:76px; resize:vertical; border:2px solid var(--line);
    border-radius:14px; padding:12px 14px; font-size:16px; font-family:inherit;
    background:var(--bg); color:var(--ink);
  }
  .write-box textarea:focus{ outline:2px solid var(--green); outline-offset:1px; }

  .reveal-btn, .next-btn{
    appearance:none; border:none; border-radius:14px; padding:14px; font-size:15px;
    font-weight:900; cursor:pointer; font-family:inherit; color:#fff; background:var(--blue);
  }
  .next-btn{ background:var(--accent); }

  .answer-panel{
    border-radius:14px; padding:14px 16px; display:flex; flex-direction:column; gap:6px;
    animation: pop .18s ease;
  }
  @keyframes pop{ from{ transform:scale(.97); opacity:0;} to{ transform:scale(1); opacity:1;} }
  .answer-panel.ok{ background:var(--ok-bg); border:2px solid var(--ok); }
  .answer-panel.ng{ background:var(--ng-bg); border:2px solid var(--ng); }
  .answer-panel .verdict{ font-weight:900; font-size:15px; }
  .answer-panel.ok .verdict{ color:var(--ok); }
  .answer-panel.ng .verdict{ color:var(--ng); }
  .answer-panel .ans{ font-size:20px; font-weight:900; }
  .answer-panel .kana{ font-size:12.5px; color:var(--ink-soft); }

  .self-grade-row{ display:flex; gap:10px; }
  .grade-btn{
    flex:1; appearance:none; border:2px solid var(--line); background:var(--paper);
    border-radius:14px; padding:14px; font-size:17px; font-weight:900; cursor:pointer;
    font-family:inherit; display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .grade-btn.ok-btn{ color:var(--ok); }
  .grade-btn.ok-btn:active{ background:var(--ok-bg); border-color:var(--ok); }
  .grade-btn.ng-btn{ color:var(--ng); }
  .grade-btn.ng-btn:active{ background:var(--ng-bg); border-color:var(--ng); }

  .quit-link{
    align-self:center; background:none; border:none; color:var(--ink-soft);
    font-size:12.5px; text-decoration:underline; cursor:pointer; font-family:inherit; padding:6px;
  }

  /* ---------- RESULT SCREEN ---------- */
  .score-hero{ text-align:center; display:flex; flex-direction:column; gap:6px; padding:6px 0 4px; }
  .score-big{ font-size:52px; font-weight:900; color:var(--green-deep); font-variant-numeric:tabular-nums; line-height:1; }
  .score-big span{ font-size:22px; color:var(--ink-soft); font-weight:700; }
  .score-msg{ font-size:14px; color:var(--ink-soft); }

  .review-list{ display:flex; flex-direction:column; gap:8px; }
  .review-item{
    display:flex; gap:10px; align-items:flex-start; border:1px solid var(--line);
    border-radius:12px; padding:10px 12px; background:var(--bg);
  }
  .review-item .mark{ flex:none; font-weight:900; font-size:15px; margin-top:1px; }
  .review-item.ok .mark{ color:var(--ok); }
  .review-item.ng .mark{ color:var(--ng); }
  .review-item .body{ display:flex; flex-direction:column; gap:2px; }
  .review-item .q{ font-size:13.5px; font-weight:700; line-height:1.5; }
  .review-item .a{ font-size:13px; color:var(--ink-soft); }
  .review-item .a b{ color:var(--ink); }

  .result-actions{ display:flex; flex-direction:column; gap:10px; }
  .secondary-btn{
    appearance:none; border:2px solid var(--line); background:var(--paper); color:var(--ink);
    border-radius:14px; padding:13px; font-size:14.5px; font-weight:900; cursor:pointer; font-family:inherit;
  }

  [hidden]{ display:none !important; }
  .foot-note{ text-align:center; font-size:11px; color:var(--ink-soft); padding-top:4px; }

  /* ---------- REGION SELECT ---------- */
  .back-link{
    align-self:flex-start; background:none; border:none; color:var(--ink-soft);
    font-size:12.5px; text-decoration:underline; cursor:pointer; font-family:inherit;
    padding:2px 0 0; display:flex; align-items:center; gap:2px;
  }
  .link-btn{
    align-self:flex-start; background:none; border:none; color:var(--ink-soft);
    font-size:12.5px; text-decoration:underline; cursor:pointer; font-family:inherit;
    padding:2px 0 0; display:inline-flex; align-items:center; gap:2px; text-decoration-line:underline;
  }
  .region-grid{ display:flex; flex-direction:column; gap:10px; }
  .region-card{
    appearance:none; width:100%; text-align:left; border:2px solid var(--line);
    background:var(--paper); border-radius:16px; padding:14px 16px; cursor:pointer;
    font-family:inherit; color:var(--ink); display:flex; align-items:center; gap:12px;
  }
  .region-card .emoji{ font-size:26px; flex:none; }
  .region-card .body{ flex:1; min-width:0; }
  .region-card .name{ font-weight:900; font-size:16px; }
  .region-card .name .round-tag{ font-size:11px; font-weight:700; color:var(--ink-soft); margin-left:4px; white-space:nowrap; }
  .region-card .meta{ font-size:12px; color:var(--ink-soft); margin-top:2px; display:flex; gap:8px; flex-wrap:wrap; }
  .region-card .meta .weak-flag{ color:var(--accent-deep); font-weight:700; }
  .region-card .chevron{ flex:none; color:var(--ink-soft); font-size:18px; }
  .region-card:disabled{ opacity:.45; cursor:not-allowed; }
  .region-card.mix{ border-style:dashed; border-color:var(--green); }
  .region-card .meta .mix-badge{ color:var(--green-deep); font-weight:700; }
  .region-card .meta .prep-flag{ font-weight:700; }
  .view-toggle{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px; }
  .view-btn{
    appearance:none; border:2px solid var(--line); background:var(--paper); color:var(--ink);
    border-radius:12px; padding:9px 8px; font-family:inherit; font-size:14px; font-weight:700; cursor:pointer;
  }
  .view-btn[aria-pressed="true"]{ background:var(--green); border-color:var(--green); color:#fff; }
</style>

/* ============================================================
   STATE / STORAGE
   にがてスコア・今日/今週の合計は common.js の KQHub に一本化。
   地方ごとの「といた数／せいかい率」表示だけ、このアプリ専用の
   軽いローカル記録（kq-shakai-）に残す。
============================================================ */
var SUBJECT = "shakai";
function fullKey(regionId, id){ return SUBJECT + ":" + regionId + ":" + id; }

var REGION_STORE_KEY = "kq-shakai-region-play-v1";
var regionPlay = loadRegionPlay();

function loadRegionPlay(){
  try{
    var raw = localStorage.getItem(REGION_STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {};
}
function saveRegionPlay(){
  try{ localStorage.setItem(REGION_STORE_KEY, JSON.stringify(regionPlay)); }catch(e){}
}
function regionStats(regionId){
  if(!regionPlay[regionId]) regionPlay[regionId] = { totalAnswered:0, totalCorrect:0 };
  return regionPlay[regionId];
}

/* ---- 日付まわりのヘルパー ---- */
function pad2(n){ return n<10 ? "0"+n : ""+n; }
function dateKey(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function todayKey(){ return dateKey(new Date()); }
// 直近7日分（今日をふくむ）の Date を古い順で返す
function last7Days(){
  var out = [];
  var now = new Date();
  for(var i=6;i>=0;i--){
    var d = new Date(now);
    d.setDate(now.getDate()-i);
    out.push(d);
  }
  return out;
}
// 今週（月曜始まり）の合計
function thisWeekTotals(){
  var now = new Date();
  var day = now.getDay(); // 0=日
  var diffToMonday = (day===0) ? -6 : (1-day);
  var monday = new Date(now);
  monday.setDate(now.getDate()+diffToMonday);
  var total=0, correct=0;
  for(var i=0;i<7;i++){
    var d = new Date(monday);
    d.setDate(monday.getDate()+i);
    if(d > now) break;
    var e = KQHub.getStatsFor(d, SUBJECT);
    total+=e.total; correct+=e.correct;
  }
  return { total:total, correct:correct };
}
function recordAnswer(regionId, id, correct){
  var rs = regionStats(regionId);
  rs.totalAnswered++;
  if(correct) rs.totalCorrect++;
  saveRegionPlay();
  KQHub.recordAnswer(SUBJECT, fullKey(regionId, id), correct);
}
// 問題の持ち主の単元ID。複数単元ミックス(まとめ回)の問題は _rid に元の単元IDを持つ
function ridOf(q, fallbackRegionId){ return q._rid || fallbackRegionId; }
function weakCount(regionId, questions){
  return KQHub.countWeakFresh(questions.map(function(q){ return fullKey(ridOf(q, regionId), q.id); }));
}

/* ============================================================
   HELPERS
============================================================ */
function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function pickN(arr, n){ return shuffle(arr).slice(0, n); }

// 答えの「種類」を判定する。選択肢は必ず同じ種類でそろえる
// （例：「〇〇平野は？」の答えが平野なら、選択肢も平野の名前だけにする）
function answerGroup(a){
  if(/^(富士山|八ヶ岳|浅間山|大雪山|磐梯山|大台ヶ原山|大山|石鎚山|阿蘇山|雲仙岳|開聞岳|宮之浦岳)$/.test(a)) return "mountain"; // 単体の山
  if(a==="奥多摩") return "mountainarea";                        // 山地（山脈と呼ばない広い山地名）
  if(/山地$/.test(a)) return "mountainarea";                     // 〇〇山地
  if(/山脈$/.test(a)) return "range";                             // 山脈
  if(/^[北中央南]+アルプス$/.test(a)) return "altname";           // アルプスの別名
  if(/平野$/.test(a)) return "plain";                             // 平野
  if(/盆地$/.test(a)) return "basin";                             // 盆地
  if(a==="牧ノ原" || a==="武蔵野" || a==="下総台地" || a==="シラス台地") return "plateau"; // 台地
  if(/半島$/.test(a)) return "peninsula";                         // 半島
  if(/海峡$/.test(a)) return "strait";                            // 海峡
  if(/(湾|海)$/.test(a)) return "bay";                            // 湾・内海
  if(a==="敦賀") return "port";                                   // 港町
  if(/諸島$/.test(a)) return "islandgroup";                       // 諸島・群島
  if(/島$/.test(a)) return "island";                              // 島
  if(a==="木曽三川") return "riverset";                           // 川のまとまり
  if(/川$/.test(a)) return "river";                               // 川
  if(/湖$/.test(a)) return "lake";                                // 湖
  if(a==="鵜飼") return "method";                                 // 漁法
  if(/新幹線$/.test(a)) return "shinkansen";                      // 新幹線
  if(/海道$/.test(a) && a!=="北海道") return "bridge";           // 〇〇海道（道路）は県ではない
  if(/^(都|道|府|県)$/.test(a)) return "specialty";
  if(/[都道府県]$/.test(a)) return "prefecture";                  // 都道府県
  if(a==="東京") return "city";                                   // 都庁所在地（東京）も市とまとめる
  if(/市$/.test(a)) return "city";                                // 市（県庁所在地・豊田市など）
  return "specialty";                                             // 特産・名所などその他
}

function uniqueAnswers(list){
  var out = [], seen = {};
  list.forEach(function(q){
    if(!seen[q.a]){ seen[q.a]=true; out.push(q.a); }
  });
  return out;
}

/* 特産・名所などは「ジャンル(g)」で選択肢を作る。
   候補は全地方の問題（すべて教材の地図にのっているもの）から同じジャンルだけ集める。
   同じ県の別の特産品(p)と、実際にはその場所の特産でもあるもの(ng)は選択肢に出さない。 */
var GENRE_FROM = { sea:["sea","fish"] };   // 「海の特産品」は魚もふくめて出す
var EXTRA_POOL = [                           // 教材データだけでは3つそろわないジャンルの補い（すべて実在）
  {a:"ラベンダー", g:"flower",  p:"北海道"},
  {a:"栗林公園",   g:"garden",  p:"香川県"},
  {a:"羽田空港",   g:"airport", p:"東京都"},
  {a:"米沢牛",     g:"meat",    p:"山形県"}
];
function asList(v){ return v ? (Array.isArray(v) ? v : [v]) : []; }
function genrePool(question){
  var from = GENRE_FROM[question.g] || [question.g];
  var qPrefs = asList(question.p);
  var ng = asList(question.ng);
  var items = [];
  REGIONS.forEach(function(r){ (r.questions||[]).forEach(function(q){ if(q.g) items.push(q); }); });
  items = items.concat(EXTRA_POOL);
  var seen = {}; var out = [];
  items.forEach(function(it){
    if(from.indexOf(it.g) < 0) return;
    if(it.a === question.a || ng.indexOf(it.a) >= 0) return;
    if(asList(it.p).some(function(pp){ return qPrefs.indexOf(pp) >= 0; })) return;
    if(seen[it.a]) return;
    seen[it.a] = true; out.push(it.a);
  });
  return out;
}

function buildChoices(question){
  if(question.choices && question.choices.length){
    return shuffle(question.choices);
  }
  if(question.g){
    return shuffle(pickN(genrePool(question), 3).concat([question.a]));
  }
  var group = answerGroup(question.a);
  // ミックス出題でも、まちがい選択肢は同じ単元の問題から作る
  var ownPool = question._rid ? currentRegion.questions.filter(function(q){ return q._rid===question._rid; }) : currentRegion.questions;
  var samePool = ownPool.filter(function(q){
    return !q.g && answerGroup(q.a)===group && q.a!==question.a;   // ジャンル(g)つきの答えは別のしくみで出す
  });
  var pool = uniqueAnswers(samePool);
  var distractors = pickN(pool, 3);
  if(distractors.length < 3){
    // 同じ種類の候補が足りない場合のみ、他の種類から補う
    var usedSet = {};
    distractors.forEach(function(d){ usedSet[d]=true; });
    var otherPool = ownPool.filter(function(q){ return q.a!==question.a && !usedSet[q.a]; });
    var uniqueOther = uniqueAnswers(otherPool).filter(function(a){ return a!==question.a; });
    var need = 3 - distractors.length;
    distractors = distractors.concat(pickN(uniqueOther, need));
  }
  var choices = shuffle(distractors.slice(0,3).concat([question.a]));
  return choices;
}

function roundTagHtml(region){
  if(!SR) return "";
  var rs = SR.roundsOfUnit(region.id);
  return rs.length ? ' <span class="round-tag">第'+rs.join("・")+'回</span>' : '';
}

function regionById(id){ return REGIONS.filter(function(r){ return r.id===id; })[0] || null; }

/* ---- 複数単元ミックス（まとめ回・テスト範囲）----
   指定した単元IDの問題を合算した「仮想の地方」を作る。問題は浅いコピーに _rid（元の単元ID）を
   持たせ、にがて/未挑戦の記録キー・正答記録は元の単元のまま（地方ビューと共通）にする。 */
function buildMixRegion(unitIds, name, subtitle){
  var members = unitIds.map(regionById).filter(function(r){ return r && r.questions.length>0; });
  var qs = [];
  members.forEach(function(r){
    r.questions.forEach(function(q){ var c = {}; for(var k in q){ c[k]=q[k]; } c._rid = r.id; qs.push(c); });
  });
  return {
    id: "mix:"+members.map(function(r){ return r.id; }).join("+"),
    isMix: true,
    memberIds: members.map(function(r){ return r.id; }),
    emoji: "🧩",
    name: name,
    subtitle: subtitle || members.map(function(r){ return r.name.replace(/地方$/,""); }).join("・"),
    leadSuffix: "の問題をまぜて出題します。",
    questions: qs
  };
}

      target = isMix

        (wf.weak>0 ? '<span class="weak-flag">にがて '+wf.weak+'問</span>' : '')+

// 全地方合算のきろく（トップ画面）
function refreshGlobalStats(){
  var todayEntry = KQHub.getStatsFor(new Date(), SUBJECT);
  statToday.textContent = todayEntry.correct + "/" + todayEntry.total;
  var week = thisWeekTotals();
  statWeek.textContent = week.correct + "/" + week.total;

  var days = last7Days();
  var todayStr = todayKey();
  var maxTotal = 1;
  days.forEach(function(d){
    var e = KQHub.getStatsFor(d, SUBJECT);
    if(e && e.total > maxTotal) maxTotal = e.total;
  });
  weekChart.innerHTML = "";
  days.forEach(function(d){
    var key = dateKey(d);
    var e = KQHub.getStatsFor(d, SUBJECT);
    var isToday = key === todayStr;
    var pct = e.total>0 ? Math.max(10, Math.round(e.total/maxTotal*100)) : 0;

    var col = document.createElement("div");
    col.className = "col" + (isToday ? " today" : "");

    var track = document.createElement("div");
    track.className = "bar-track";
    var fill = document.createElement("div");
    fill.className = "bar-fill" + (e.total>0 ? (isToday ? " today" : " has-data") : "");
    fill.style.height = pct + "%";
    fill.title = key + "：" + e.correct + "/" + e.total + "問正解";
    track.appendChild(fill);

    var dow = document.createElement("div");
    dow.className = "dow";
    dow.textContent = DOW_LABEL[d.getDay()];

    col.appendChild(track);
    col.appendChild(dow);
    weekChart.appendChild(col);
  });
}

function refreshRegionStats(){
  if(!currentRegion) return;
  var rs;
  if(currentRegion.isMix){
    // ミックスは元の単元ごとの記録を合算して表示する
    rs = { totalAnswered:0, totalCorrect:0 };
    currentRegion.memberIds.forEach(function(id){
      var m = regionStats(id);
      rs.totalAnswered += m.totalAnswered; rs.totalCorrect += m.totalCorrect;
    });
  }else{
    rs = regionStats(currentRegion.id);
  }
  var wf = weakCount(currentRegion.id, currentRegion.questions);
  var w = wf.weak;
  statPlayed.textContent = rs.totalAnswered;
  statAcc.textContent = rs.totalAnswered>0 ? Math.round(rs.totalCorrect/rs.totalAnswered*100)+"%" : "–";
  statWeak.textContent = w;
  weakBadge.textContent = "にがて"+w+"問・未挑戦"+wf.fresh+"問";
  weakBtn.disabled = false;
}

/* ============================================================
   QUIZ FLOW
============================================================ */
var quizQueue = [];
var quizIndex = 0;
var quizResults = []; // {q, correct, userAnswer}
var currentChoices = [];

function beginQuiz(){
  var regionId = currentRegion.id;
  if(useWeakOnly){
    var basePool = currentRegion.questions.slice();
    var n0 = Math.min(10, basePool.length);
    quizQueue = KQHub.weightedSample(basePool, function(q){ return fullKey(ridOf(q, regionId), q.id); }, n0);
    quizIndex = 0;
    quizResults = [];
    screenHome.hidden = true;
    screenResult.hidden = true;
    screenQuiz.hidden = false;
    renderQuestion();
    return;
  }
  var pool = currentRegion.questions.filter(function(q){ return activeCats.indexOf(q.cat)>=0; });
  if(pool.length===0) pool = currentRegion.questions.slice();
  var n = Math.min(10, pool.length);
  quizQueue = pickN(pool, n);
  quizIndex = 0;
  quizResults = [];
  screenHome.hidden = true;
  screenResult.hidden = true;
  screenQuiz.hidden = false;
  renderQuestion();
}

function renderQuestion(){
  var q = quizQueue[quizIndex];
  progressNum.textContent = (quizIndex+1)+"/"+quizQueue.length;
  progressFill.style.width = ((quizIndex)/quizQueue.length*100)+"%";
  qCatTag.textContent = CATS[q.cat];
  qText.textContent = q.q;

  answerPanel.hidden = true;
  nextBtn.hidden = true;
  selfGradeRow.hidden = true;

  if(mode==="choice"){
    choiceGrid.hidden = false;
    writeBox.hidden = true;
    revealBtn.hidden = true;
    currentChoices = buildChoices(q);
    choiceGrid.innerHTML = "";
    var letters = ["A","B","C","D"];
    currentChoices.forEach(function(choiceText, i){
      var btn = document.createElement("button");
      btn.className = "choice-btn";
      btn.type = "button";
      btn.innerHTML = '<span class="idx">'+letters[i]+'</span><span>'+choiceText+"</span>";
      btn.addEventListener("click", function(){ onChoiceSelected(choiceText, btn); });
      choiceGrid.appendChild(btn);
    });
  } else {
    choiceGrid.hidden = true;
    writeBox.hidden = false;
    writeInput.value = "";
    writeInput.disabled = false;
    revealBtn.hidden = false;
    setTimeout(function(){ writeInput.focus(); }, 50);
  }
}

function onChoiceSelected(choiceText, btnEl){
  var q = quizQueue[quizIndex];
  var correct = choiceText === q.a;
  Array.from(choiceGrid.children).forEach(function(btn){
    btn.disabled = true;
    var txt = btn.querySelector("span:last-child").textContent;
    if(txt === q.a){ btn.classList.add("correct"); }
    else if(btn===btnEl){ btn.classList.add("wrong"); }
    else { btn.classList.add("dim"); }
  });
  showAnswer(correct);
  finishQuestion(q, correct);
}

revealBtn.addEventListener("click", function(){
  revealBtn.hidden = true;
  writeInput.disabled = true;
  var q = quizQueue[quizIndex];
  answerPanel.hidden = false;
  answerPanel.className = "answer-panel";
  verdictText.textContent = "こたえ";
  ansText.textContent = q.a;
  ansKana.textContent = q.kana || "";
  selfGradeRow.hidden = false;
});

gradeOkBtn.addEventListener("click", function(){ selfGrade(true); });
gradeNgBtn.addEventListener("click", function(){ selfGrade(false); });

function selfGrade(correct){
  var q = quizQueue[quizIndex];
  selfGradeRow.hidden = true;
  answerPanel.className = "answer-panel " + (correct ? "ok":"ng");
  verdictText.textContent = correct ? "⭕ せいかい！" : "❌ おしい！";
  finishQuestion(q, correct, writeInput.value);
}

function showAnswer(correct){
  answerPanel.hidden = false;
  answerPanel.className = "answer-panel " + (correct ? "ok":"ng");
  verdictText.textContent = correct ? "⭕ せいかい！" : "❌ ざんねん！";
  var q = quizQueue[quizIndex];
  ansText.textContent = q.a;
  ansKana.textContent = q.kana || "";
}

function finishQuestion(q, correct, userAnswer){
  recordAnswer(ridOf(q, currentRegion.id), q.id, correct);
  quizResults.push({ q:q, correct:correct, userAnswer:userAnswer||"" });
  progressFill.style.width = ((quizIndex+1)/quizQueue.length*100)+"%";
  nextBtn.hidden = false;
}

nextBtn.addEventListener("click", function(){
  quizIndex++;
  if(quizIndex >= quizQueue.length){
    showResult();
  } else {
    renderQuestion();
  }
});

quitBtn.addEventListener("click", function(){
  screenQuiz.hidden = true;
  screenHome.hidden = false;
  refreshRegionStats();
});

  screenResult.hidden = true;
  screenHome.hidden = false;
  refreshRegionStats();
});

/* ============================================================
   BOOT
============================================================ */
renderRegionGrid();
renderRoundGrid();
applySelectView();
refreshGlobalStats();

// 玄関からの「今日のおすすめ」ワンタップ起動
// ?start=weak&region=chubu のように渡された場合、その地方を選んで即にがて特訓を開始する
(function applyDeepLinkStart(){
  try{
    var params = { get: function(n){ return KQHub.getParam(n); } };
    if(params.get("start") !== "weak") return;
    var region = null;
    var roundsParam = params.get("rounds");
    if(roundsParam && SR){
      // ?start=weak&rounds=6,7 : テスト範囲の回（まとめ回も可）。単元が1つならその地方、複数ならミックス
      var nums = roundsParam.split(",").map(Number).filter(function(n){ return n>0; });
      var ids = SR.unitsForRounds(nums).filter(regionById);
      if(ids.length===1) region = regionById(ids[0]);
      else if(ids.length>1) region = buildMixRegion(ids, "テスト範囲 "+SR.rangeText(nums), null);
    }else{
      region = regionById(params.get("region"));
    }
    if(!region || !region.questions.length) return;
    selectRegion(region);
    useWeakOnly = true;
    beginQuiz();
  }catch(e){}
})();

})();
</script>
