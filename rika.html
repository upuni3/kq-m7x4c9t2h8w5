<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>理科たんけんクイズ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
  :root{
    --bg:#fbf3e6;
    --paper:#fffdf9;
    --ink:#3a2a14;
    --ink-soft:#8a6a44;
    --accent:#c07a2e;
    --accent-deep:#633806;
    --accent-bg:#faeeda;
    --accent-bg-deep:#f3ddb8;
    --blue:#3f6fa0;
    --ok:#3f8d4f;
    --ok-bg:#e5f3e2;
    --ng:#c04a3a;
    --ng-bg:#fbe6e1;
    --line: rgba(99,56,6,0.14);
    --shadow: 0 10px 24px -12px rgba(90,55,10,0.28);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#20180e;
      --paper:#2a1f13;
      --ink:#f3e6d2;
      --ink-soft:#c9a877;
      --accent:#e3a35c;
      --accent-deep:#f2c384;
      --accent-bg:#3a2a14;
      --accent-bg-deep:#4a3419;
      --blue:#7fb0e0;
      --ok:#7fce8f;
      --ok-bg:#213524;
      --ng:#e78474;
      --ng-bg:#3a2320;
      --line: rgba(243,230,210,0.14);
      --shadow: 0 10px 26px -12px rgba(0,0,0,0.55);
    }
  }
  :root[data-theme="dark"]{
    --bg:#20180e;
    --paper:#2a1f13;
    --ink:#f3e6d2;
    --ink-soft:#c9a877;
    --accent:#e3a35c;
    --accent-deep:#f2c384;
    --accent-bg:#3a2a14;
    --accent-bg-deep:#4a3419;
    --blue:#7fb0e0;
    --ok:#7fce8f;
    --ok-bg:#213524;
    --ng:#e78474;
    --ng-bg:#3a2320;
    --line: rgba(243,230,210,0.14);
    --shadow: 0 10px 26px -12px rgba(0,0,0,0.55);
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', 'Hiragino Sans', 'Noto Sans JP', sans-serif;
    padding-inline:16px;
    padding-block:24px;
    min-height:100%;
    display:flex;
    justify-content:center;
  }
  .app{ width:100%; max-width:560px; display:flex; flex-direction:column; gap:16px; }

  h1,h2,h3{ font-family:'Zen Maru Gothic', 'Zen Kaku Gothic New', sans-serif; margin:0; text-wrap:balance; }

  .topbar{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
  .topbar .kicker{ font-size:12px; letter-spacing:.08em; color:var(--ink-soft); font-weight:700; }
  .title{ font-size:22px; font-weight:900; color:var(--accent-deep); }

  .card{ background:var(--paper); border:1px solid var(--line); border-radius:20px; padding:20px; box-shadow:var(--shadow); }

  .home-lead{ color:var(--ink-soft); font-size:14px; line-height:1.7; }
  .stat-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:14px; }
  .stat{ background:var(--bg); border:1px solid var(--line); border-radius:14px; padding:10px 8px; text-align:center; }
  .stat .n{ font-size:20px; font-weight:900; font-variant-numeric:tabular-nums; color:var(--accent-deep); }
  .stat .l{ font-size:11px; color:var(--ink-soft); margin-top:2px; }

  .section-label{ font-size:12px; font-weight:700; color:var(--ink-soft); letter-spacing:.06em; margin:4px 2px 0; }

  .week-chart{ display:flex; align-items:flex-end; gap:8px; height:76px; margin-top:14px; padding:0 2px; }
  .week-chart .col{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:5px; }
  .week-chart .bar-track{ width:100%; max-width:26px; height:52px; display:flex; align-items:flex-end; border-radius:6px; background:var(--bg); border:1px solid var(--line); overflow:hidden; }
  .week-chart .bar-fill{ width:100%; border-radius:5px 5px 0 0; background:var(--line); transition:height .25s ease; }
  .week-chart .bar-fill.has-data{ background:var(--accent); }
  .week-chart .bar-fill.today{ background:var(--ng); }
  .week-chart .dow{ font-size:10.5px; color:var(--ink-soft); font-weight:700; }
  .week-chart .col.today .dow{ color:var(--ng); }

  .unit-list{ display:flex; flex-direction:column; gap:10px; }
  .unit-row{ display:flex; align-items:center; gap:12px; border:2px solid var(--line); background:var(--paper); border-radius:16px; padding:12px 14px; }
  .unit-row input[type=checkbox]{ width:22px; height:22px; accent-color: var(--accent); flex:none; }
  .unit-row .body{ flex:1; min-width:0; }
  .unit-row .name{ font-weight:900; font-size:15px; }
  .unit-row .meta{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; display:flex; gap:8px; flex-wrap:wrap; }
  .unit-row .meta .weak-flag{ color:var(--ng); font-weight:700; }

  .row-actions{ display:flex; gap:10px; }
  .link-btn{ appearance:none; background:none; border:none; color:var(--accent-deep); font-weight:700; font-size:13px; text-decoration:underline; cursor:pointer; font-family:inherit; padding:4px 0; }

  .mode-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .chip-wrap{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{ appearance:none; border:1.5px solid var(--line); background:var(--paper); color:var(--ink); border-radius:999px; padding:8px 14px; font-size:13px; cursor:pointer; font-weight:700; font-family:inherit; }
  .chip[aria-pressed="true"]{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .chip .cnt{ opacity:.7; font-weight:500; }

  .weak-btn{ display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%; border:1.5px solid var(--line); background:var(--paper); border-radius:16px; padding:14px 16px; cursor:pointer; font-family:inherit; color:var(--ink); }
  .weak-btn strong{ font-size:15px; color:var(--accent-deep); }
  .weak-btn span.sub{ display:block; font-size:11.5px; color:var(--ink-soft); font-weight:500; margin-top:2px; }
  .weak-btn .badge{ background:var(--ng); color:#fff; font-weight:900; font-size:13px; border-radius:12px; padding:4px 10px; font-variant-numeric:tabular-nums; flex:none; text-align:center; }
  .weak-btn .chevron{ font-size:18px; color:var(--ink-soft); flex:none; }
  .weak-btn:disabled{ opacity:.4; cursor:not-allowed; }

  .start-btn{ appearance:none; border:none; border-radius:16px; padding:16px; background:var(--accent); color:#fff; font-family:inherit; font-size:17px; font-weight:900; cursor:pointer; letter-spacing:.02em; box-shadow: 0 8px 18px -6px rgba(192,122,46,0.55); }
  .start-btn:active{ transform:translateY(1px); }
  .start-btn:disabled{ opacity:.4; cursor:not-allowed; }

  .progress-row{ display:flex; align-items:center; gap:10px; }
  .progress-track{ flex:1; height:8px; background:var(--line); border-radius:999px; overflow:hidden; }
  .progress-fill{ height:100%; background:var(--accent); border-radius:999px; transition:width .3s ease; }
  .progress-num{ font-size:12px; font-weight:700; color:var(--ink-soft); font-variant-numeric:tabular-nums; flex:none; }

  .quiz-card{ display:flex; flex-direction:column; gap:14px; }
  .cat-tag{ align-self:flex-start; font-size:11px; font-weight:900; letter-spacing:.05em; color:var(--accent-deep); background:var(--accent-bg); border:1px solid var(--line); border-radius:999px; padding:4px 10px; }
  .question-text{ font-size:19px; font-weight:700; line-height:1.6; }

  .qtable{ width:100%; border-collapse:collapse; font-size:13px; }
  .qtable th,.qtable td{ border:1px solid var(--line); padding:6px 4px; text-align:center; font-variant-numeric:tabular-nums; }
  .qtable th{ background:var(--bg); color:var(--ink-soft); font-weight:700; }
  .qtable-wrap{ overflow-x:auto; }

  .circuit-row{ display:flex; gap:14px; justify-content:center; flex-wrap:wrap; }
  .circuit-box{ display:flex; flex-direction:column; align-items:center; gap:4px; }
  .circuit-label{ font-weight:900; font-size:14px; color:var(--accent-deep); }
  .circuit-box svg{ display:block; }
  .circuit-box svg line, .circuit-box svg circle.node{ stroke: var(--ink); }
  .circuit-box svg circle.bulb{ stroke: var(--ink); fill: var(--paper); }
  .circuit-box svg text{ fill: var(--ink); }

  .choice-grid{ display:grid; grid-template-columns:1fr; gap:10px; }
  .choice-btn{ appearance:none; text-align:left; border:2px solid var(--line); background:var(--paper); color:var(--ink); border-radius:14px; padding:13px 16px; font-size:15.5px; font-weight:700; cursor:pointer; font-family:inherit; display:flex; gap:10px; align-items:center; }
  .choice-btn .idx{ flex:none; width:24px; height:24px; border-radius:50%; background:var(--bg); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:900; color:var(--ink-soft); }
  .choice-btn:disabled{ cursor:default; }
  .choice-btn.correct{ border-color:var(--ok); background:var(--ok-bg); color:var(--ok); }
  .choice-btn.correct .idx{ background:var(--ok); color:#fff; }
  .choice-btn.wrong{ border-color:var(--ng); background:var(--ng-bg); color:var(--ng); }
  .choice-btn.wrong .idx{ background:var(--ng); color:#fff; }
  .choice-btn.dim{ opacity:.45; }

  .write-box input[type=text], .write-box input[type=tel]{ width:100%; border:2px solid var(--line); border-radius:14px; padding:14px 16px; font-size:18px; font-family:inherit; background:var(--bg); color:var(--ink); }
  .write-box input:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .write-box .unit-suffix{ font-size:13px; color:var(--ink-soft); margin-top:4px; }

  .next-btn{ appearance:none; border:none; border-radius:14px; padding:14px; font-size:15px; font-weight:900; cursor:pointer; font-family:inherit; color:#fff; background:var(--accent); }
  .check-btn{ appearance:none; border:none; border-radius:14px; padding:14px; font-size:15px; font-weight:900; cursor:pointer; font-family:inherit; color:#fff; background:var(--blue); }

  .answer-panel{ border-radius:14px; padding:14px 16px; display:flex; flex-direction:column; gap:6px; animation: pop .18s ease; }
  @keyframes pop{ from{ transform:scale(.97); opacity:0;} to{ transform:scale(1); opacity:1;} }
  .answer-panel.ok{ background:var(--ok-bg); border:2px solid var(--ok); }
  .answer-panel.ng{ background:var(--ng-bg); border:2px solid var(--ng); }
  .answer-panel .verdict{ font-weight:900; font-size:15px; }
  .answer-panel.ok .verdict{ color:var(--ok); }
  .answer-panel.ng .verdict{ color:var(--ng); }
  .answer-panel .ans{ font-size:20px; font-weight:900; }
  .answer-panel .also{ font-size:12.5px; color:var(--ink-soft); }
  .answer-panel .exp{ font-size:13px; color:var(--ink-soft); border-top:1px dashed var(--line); padding-top:6px; margin-top:2px; line-height:1.6; }

  .quit-link{ align-self:center; background:none; border:none; color:var(--ink-soft); font-size:12.5px; text-decoration:underline; cursor:pointer; font-family:inherit; padding:6px; }

  .score-hero{ text-align:center; display:flex; flex-direction:column; gap:6px; padding:6px 0 4px; }
  .score-big{ font-size:52px; font-weight:900; color:var(--accent-deep); font-variant-numeric:tabular-nums; line-height:1; }
  .score-big span{ font-size:22px; color:var(--ink-soft); font-weight:700; }
  .score-msg{ font-size:14px; color:var(--ink-soft); }

  .review-list{ display:flex; flex-direction:column; gap:8px; }
  .review-item{ display:flex; gap:10px; align-items:flex-start; border:1px solid var(--line); border-radius:12px; padding:10px 12px; background:var(--bg); }
  .review-item .mark{ flex:none; font-weight:900; font-size:15px; margin-top:1px; }
  .review-item.ok .mark{ color:var(--ok); }
  .review-item.ng .mark{ color:var(--ng); }
  .review-item .body{ display:flex; flex-direction:column; gap:2px; }
  .review-item .q{ font-size:13.5px; font-weight:700; line-height:1.5; }
  .review-item .a{ font-size:13px; color:var(--ink-soft); }
  .review-item .a b{ color:var(--ink); }

  .result-actions{ display:flex; flex-direction:column; gap:10px; }
  .secondary-btn{ appearance:none; border:2px solid var(--line); background:var(--paper); color:var(--ink); border-radius:14px; padding:13px; font-size:14.5px; font-weight:900; cursor:pointer; font-family:inherit; }

  [hidden]{ display:none !important; }
  .foot-note{ text-align:center; font-size:11px; color:var(--ink-soft); padding-top:4px; }
  .back-link{ align-self:flex-start; background:none; border:none; color:var(--ink-soft); font-size:12.5px; text-decoration:underline; cursor:pointer; font-family:inherit; padding:2px 0 0; }
</style>
</head>
<body>

<div class="app">

  <!-- ===================== HOME (回えらび) ===================== -->
  <section id="screen-home">
    <div class="topbar">
      <div>
        <div class="kicker">理科一問一答クイズ</div>
        <div class="title">理科たんけんクイズ</div>
      </div>
      <a class="link-btn" target="_top" href="index.html">🏠 玄関へ</a>
    </div>

    <div class="card">
      <div class="section-label">きろく（全体合算）</div>
      <div class="stat-row">
        <div class="stat"><div class="n" id="statToday">0/0</div><div class="l">今日</div></div>
        <div class="stat"><div class="n" id="statWeek">0/0</div><div class="l">今週</div></div>
      </div>
      <div class="week-chart" id="weekChart"></div>
    </div>

    <div class="card">
      <div class="section-label">回をえらぶ（複数えらべます）</div>
      <div class="unit-list" id="unitList"></div>
      <div class="row-actions">
        <button class="link-btn" id="selectAllBtn">全部えらぶ</button>
        <button class="link-btn" id="selectNoneBtn">えらびなおす</button>
      </div>
    </div>

    <div class="card" id="catCard" hidden>
      <div class="section-label">出題はんい（カテゴリ）</div>
      <div class="chip-wrap" id="catChips"></div>
    </div>

    <button class="weak-btn" id="weakBtn">
      <span>
        <strong>🔥 にがて特訓モード</strong>
        <span class="sub">えらんだ回から、にがてな問題ほど出やすい10問</span>
      </span>
      <span class="badge" id="weakBadge">0問</span>
      <span class="chevron" aria-hidden="true">›</span>
    </button>

    <button class="start-btn" id="startBtn" disabled>10問はじめる</button>
    <p class="foot-note">成績はこの端末のブラウザだけに保存されます</p>
  </section>

  <!-- ===================== QUIZ ===================== -->
  <section id="screen-quiz" hidden>
    <div class="progress-row">
      <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      <div class="progress-num" id="progressNum">1/10</div>
    </div>

    <div class="card quiz-card">
      <span class="cat-tag" id="qCatTag">分類</span>
      <div class="question-text" id="qText">問題文がここに入ります</div>

      <div id="qTableWrap" hidden></div>
      <div id="qCircuitWrap" hidden></div>

      <!-- choice grid (pick / choice) -->
      <div class="choice-grid" id="choiceGrid" hidden></div>

      <!-- write box (text / num) -->
      <div class="write-box" id="writeBox" hidden>
        <input type="text" id="writeInput" placeholder="ここに答えを書いてね" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <div class="unit-suffix" id="unitSuffix" hidden></div>
      </div>
      <button class="check-btn" id="checkBtn" hidden>こたえあわせ</button>

      <div class="answer-panel" id="answerPanel" hidden>
        <div class="verdict" id="verdictText"></div>
        <div class="ans" id="ansText"></div>
        <div class="also" id="ansAlso" hidden></div>
        <div class="exp" id="ansExp" hidden></div>
      </div>

      <button class="next-btn" id="nextBtn" hidden>つぎへ →</button>
    </div>

    <button class="quit-link" id="quitBtn">やめてホームにもどる</button>
  </section>

  <!-- ===================== RESULT ===================== -->
  <section id="screen-result" hidden>
    <div class="card score-hero">
      <div class="section-label">けっか</div>
      <div class="score-big"><span id="resultScore">0</span><span>/10問 正解</span></div>
      <div class="score-msg" id="resultMsg"></div>
    </div>

    <div class="card">
      <div class="section-label">今回のふりかえり</div>
      <div class="review-list" id="reviewList"></div>
    </div>

    <div class="result-actions">
      <button class="start-btn" id="retryBtn">もう10問やる</button>
      <button class="secondary-btn" id="homeBtn">ホームにもどる</button>
    </div>
  </section>

</div>

<script>window.KQ_STATIC=true;window.KQ_PAGE="rika";window.KQ_REPORT_URL="https://script.google.com/macros/s/AKfycby687LvFEfQsD0mvNnzUHikwb67ZGJ7fzP9yeC81q5SbpD043nhpPnTEmRS_3NTuwZw0w/exec";</script>
<script src="common.js"></script>
<script>
/* ============================================================
   DATA — 出典：予習シリーズ理科4年下（本体・計算編・穴埋め編）＋
   早稲田アカデミー「予習シリーズまとめプリント」の写真
   写真に写っている内容のみを出題。計算問題のみ exp（解説）を付ける。
============================================================ */

var CATS = {
  u01: { A:"骨・筋肉", B:"呼吸", C:"消化", D:"血液の流れ", E:"感覚器官" },
  u02: { A:"秋の植物", B:"種子・実の散らばり方", C:"昆虫", D:"動物・鳥・魚" },
  u03: { A:"電気を通す・通さない", B:"豆電球・LED・モーター", C:"電気をつくり出すもの", D:"回路・検流計" },
  u04: { A:"回路図・基本知識", B:"かん電池のつなぎ方", C:"豆電球のつなぎ方", D:"回路の明るさ比べ", E:"くらしの中の電気" },
  u06: { A:"水に溶けるということ", B:"限度量・飽和水溶液", C:"とける量の計算" },
  u07: { A:"ろ過・再結晶", B:"限度量の表を読む", C:"とける量の計算（応用）" },
  u08: { A:"川の3作用と地形", B:"地層・化石", C:"堆積物と水はけ・防災利用" },
  u09: { A:"力のつり合い・作用反作用", B:"ばねの性質", C:"ばねの計算", D:"いろいろなばね" }
};

/* ---- 秋の七草（穴埋め7問を作るための元データ） ---- */
var AKINONANAKUSA = ["ハギ","ススキ","キキョウ","ナデシコ","オミナエシ","クズ","フジバカマ"];
var NANAKUSA_ALTS = {
  "ハギ":["萩"], "ススキ":["薄","芒"], "キキョウ":["桔梗"], "ナデシコ":["撫子"],
  "オミナエシ":["女郎花"], "クズ":["葛"], "フジバカマ":["藤袴"]
};
function buildNanakusaQuestions(){
  return AKINONANAKUSA.map(function(target, i){
    var shown = AKINONANAKUSA.map(function(x){ return x===target ? "（？）" : x; });
    return {
      id: "U02-A0"+(4+i), cat:"A", type:"choice", g:"nanakusa",
      q: "秋の七草は、"+shown.join("・")+"です。（？）に入る植物は？",
      a: target, alts: NANAKUSA_ALTS[target]
    };
  });
}

/* ============================================================
   第2回 秋の生物
============================================================ */
var QUESTIONS_U02 = [
  // --- A. 秋の植物 ---
  { id:"U02-A01", cat:"A", type:"choice", g:"aki_hana", q:"秋分の日のころに花をさかせ、花がかれるころ球根に養分をたくわえ、葉を出して次の春まで光合成を行う植物は？", a:"ヒガンバナ", alts:["彼岸花"] },
  { id:"U02-A02", cat:"A", type:"pick", q:"ススキの開花が早いのは、南の地方と北の地方のどちら？", pick:["南の地方","北の地方"], a:"北の地方" },
  { id:"U02-A03", cat:"A", type:"pick", q:"ススキの開花が早いのは、山地と平地のどちら？", pick:["山地","平地"], a:"山地" },
].concat(buildNanakusaQuestions()).concat([
  { id:"U02-A11", cat:"A", type:"choice", g:"shokubutsu_nakama", q:"キク・コスモス・ダリア・マリーゴールド・マーガレットは、すべて何という植物のなかま？", a:"キク" },
  { id:"U02-A12", cat:"A", type:"choice", g:"aki_hana", q:"あまい香りが特ちょうで、秋に花がさく庭木は？", a:"キンモクセイ" },
  { id:"U02-A13", cat:"A", type:"choice", g:"jumoku_type", q:"一年中緑色の葉をつけている樹木を何という？", a:"常緑樹", kana:"じょうりょくじゅ" },
  { id:"U02-A14", cat:"A", type:"choice", q:"クヌギ・コナラ・スギのうち、常緑樹はどれ？", a:"スギ", g:"tree" },

/* ============================================================
   採点エンジン
============================================================ */
function toKatakana(s){
  return s.replace(/[ぁ-ゖ]/g, function(c){
    return String.fromCharCode(c.charCodeAt(0) + 0x60);
  });
}
function normalizeAnswer(s){
  if(s===null || s===undefined) return "";
  var t = String(s).normalize("NFKC");
  t = toKatakana(t);
  t = t.replace(/[\s　。、・･]/g, "");
  return t;
}
function answerSetFor(q){
  if(q._answerSet) return q._answerSet;
  var raw = [q.a].concat(q.alts||[]).concat(q.also||[]);
  if(q.kana) raw.push(q.kana);
  var set = {};
  raw.forEach(function(s){ set[normalizeAnswer(s)] = true; });
  q._answerSet = set;
  return set;
}
function gradeText(userInput, q){
  var norm = normalizeAnswer(userInput);
  if(!norm) return false;
  return !!answerSetFor(q)[norm];
}
function gradeNum(userInput, q){
  var t = String(userInput).normalize("NFKC");
  t = t.replace(/[^0-9.\-]/g, "");
  if(t==="" || t==="-" ) return false;
  var v = parseFloat(t);
  if(isNaN(v)) return false;
  return Math.abs(v - q.a) < 0.001;
}
function gradeAnswer(userInput, q){
  if(q.type==="num") return gradeNum(userInput, q);
  if(q.type==="text" || q.type==="choice") return gradeText(userInput, q);
  return userInput === q.a; // pick / circuit
}

function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function pickN(arr, n){ return shuffle(arr).slice(0, n); }

function buildChoiceOptions(q){
  var pool = [];
  ALL_QUESTIONS.forEach(function(item){
    if(item.g===q.g && item.a!==q.a && pool.indexOf(item.a)===-1) pool.push(item.a);
  });
  (FALLBACK_POOL[q.g]||[]).forEach(function(v){
    if(v!==q.a && pool.indexOf(v)===-1) pool.push(v);
  });
  var distractors = pickN(pool, 3);
  return shuffle(distractors.concat([q.a]));
}

/* ============================================================
   回路図SVG生成
============================================================ */
function parseKind(code){
  if(code==="1") return { count:1, series:1 };
  if(code[0]==="s") return { count:1, series: parseInt(code.slice(1),10) };
  if(code[0]==="p") return { count: parseInt(code.slice(1),10), series:1 };
  return { count:1, series:1 };
}

function svgLine(x1,y1,x2,y2){ return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke-width="2.4" stroke-linecap="round"></line>'; }
function svgDot(x,y){ return '<circle class="node" cx="'+x+'" cy="'+y+'" r="2.6" fill="currentColor"></circle>'; }

function symbolBulb(cx, cy, horizontal){
  var r = 8;
  var s = '<circle class="bulb" cx="'+cx+'" cy="'+cy+'" r="'+r+'" stroke-width="2"></circle>';
  var k = r*0.62;
  s += '<line x1="'+(cx-k)+'" y1="'+(cy-k)+'" x2="'+(cx+k)+'" y2="'+(cy+k)+'" stroke-width="1.6"></line>';
  s += '<line x1="'+(cx-k)+'" y1="'+(cy+k)+'" x2="'+(cx+k)+'" y2="'+(cy-k)+'" stroke-width="1.6"></line>';
  return s;
}
function symbolBattery(cx, cy){
  // 横向きの配線を縦の目盛りが横切る形（+は長い細線、-は短い太線）
  var longH = 10, shortH = 6.5, gap = 3.6;
  var s = "";
  s += svgLine(cx-gap, cy-longH, cx-gap, cy+longH);
  s += '<line x1="'+(cx+gap)+'" y1="'+(cy-shortH)+'" x2="'+(cx+gap)+'" y2="'+(cy+shortH)+'" stroke-width="5" stroke-linecap="round"></line>';
  return s;
}

// 1つの部品グループ（豆電球 or かん電池）を、辺(edgeY)〜中央線(innerY)の間に描く。
// 実際の教科書のように、四角形の左右の辺（x0,x1の縦線）をそのままバス線として使い、
// count===1なら辺(edgeY)の上に一直線で描き、count>1なら複数本の横線を均等な間隔で並べる。
function drawComponentRail(x0, x1, edgeY, innerY, kind, symbolFn){
  var svg = "";
  var n = kind.count;
  var ns = kind.series;
  if(n === 1){
    svg += svgLine(x0, edgeY, x1, edgeY);
    for(var i=0;i<ns;i++){
      var cx = x0 + (x1-x0) * ((i+1)/(ns+1));
      svg += symbolFn(cx, edgeY);
    }
  } else {
    for(var b=0;b<n;b++){
      var by = edgeY + (innerY-edgeY) * ((b+1)/(n+1));
      svg += svgLine(x0, by, x1, by);
      for(var s=0;s<ns;s++){
        var cx2 = x0 + (x1-x0) * ((s+1)/(ns+1));
        svg += symbolFn(cx2, by);
      }
    }
  }
  return svg;
}

// そのグループの一番外側（辺に一番近い枝）のY座標。count===1なら辺そのもの。
function outerBranchY(edgeY, innerY, count){
  if(count === 1) return edgeY;
  return edgeY + (innerY-edgeY) * (1/(count+1));
}

function generateCircuitSVG(spec){
  var W=190, H=170, L=26, R=164, TOP=20, BOT=150, MID=85;
  var bat = parseKind(spec.bat);
  var bulb = parseKind(spec.bulb);
  // 縦の左右の辺は、実際に部品がある範囲だけを結ぶ（並列で枝が内側にある分だけ短くし、余分な飛び出しをなくす）
  var topY = outerBranchY(TOP, MID, bulb.count);
  var botY = outerBranchY(BOT, MID, bat.count);
  var svg = '<svg viewBox="0 0 '+W+' '+H+'" width="150" height="'+Math.round(150*H/W)+'">';
  svg += svgLine(L, topY, L, botY); // 左側（そのままバス線を兼ねる）
  svg += svgLine(R, topY, R, botY); // 右側（そのままバス線を兼ねる）
  svg += drawComponentRail(L, R, TOP, MID, bulb, symbolBulb);  // 上半分：豆電球
  svg += drawComponentRail(L, R, BOT, MID, bat, symbolBattery); // 下半分：かん電池
  svg += '</svg>';
  return svg;
}

function renderTable(tableKey){
  var t = SOLUBILITY[tableKey];

  var html = '<div class="qtable-wrap"><table class="qtable"><thead><tr><th>水温[℃]</th>';
  temps.forEach(function(temp){ html += "<th>"+temp+"</th>"; });
  html += '</tr></thead><tbody><tr><th>'+t.name+'['+t.unit+']</th>';
  temps.forEach(function(temp){ html += "<td>"+t.data[temp]+"</td>"; });
  html += "</tr></tbody></table></div>";
  return html;
}

/* ============================================================
   STATE / STORAGE（きろくは common.js の KQHub に一本化）
============================================================ */
var SUBJECT = "rika";
function fullKey(id){ return SUBJECT + ":" + id; }
function pad2(n){ return n<10 ? "0"+n : ""+n; }
function dateKey(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function todayKey(){ return dateKey(new Date()); }
function last7Days(){
  var out = [], now = new Date();
  for(var i=6;i>=0;i--){ var d = new Date(now); d.setDate(now.getDate()-i); out.push(d); }
  return out;
}
function thisWeekTotals(){
  var now = new Date(); var day = now.getDay();
  var diffToMonday = (day===0) ? -6 : (1-day);
  var monday = new Date(now); monday.setDate(now.getDate()+diffToMonday);
  var total=0, correct=0;
  for(var i=0;i<7;i++){
    var d = new Date(monday); d.setDate(monday.getDate()+i);
    if(d > now) break;
    var e = KQHub.getStatsFor(d, SUBJECT);
    total+=e.total; correct+=e.correct;
  }
  return { total:total, correct:correct };
}
function recordAnswer(id, correct){
  KQHub.recordAnswer(SUBJECT, fullKey(id), correct);
}
function weakCountForUnits(unitIds){
  var keys = [];
  UNITS.forEach(function(u){
    if(unitIds.indexOf(u.id)<0) return;
    u.questions.forEach(function(q){ keys.push(fullKey(q.id)); });
  });
  return KQHub.countWeakFresh(keys);
}

function refreshGlobalStats(){
  var todayEntry = KQHub.getTodayStats()[SUBJECT] || {total:0, correct:0};
  statToday.textContent = todayEntry.correct + "/" + todayEntry.total;
  var week = thisWeekTotals();
  statWeek.textContent = week.correct + "/" + week.total;

  var days = last7Days();
  var todayStr = todayKey();
  var maxTotal = 1;
  days.forEach(function(d){ var e = KQHub.getStatsFor(d, SUBJECT); if(e.total>maxTotal) maxTotal = e.total; });
  weekChart.innerHTML = "";
  days.forEach(function(d){
    var key = dateKey(d);
    var e = KQHub.getStatsFor(d, SUBJECT);
    var isToday = key === todayStr;
    var pct = e.total>0 ? Math.max(10, Math.round(e.total/maxTotal*100)) : 0;
    var col = document.createElement("div");
    col.className = "col" + (isToday ? " today" : "");
    var track = document.createElement("div"); track.className = "bar-track";
    var fill = document.createElement("div");
    fill.className = "bar-fill" + (e.total>0 ? (isToday ? " today" : " has-data") : "");
    fill.style.height = pct + "%";
    fill.title = key + "：" + e.correct + "/" + e.total + "問正解";
    track.appendChild(fill);
    var dow = document.createElement("div"); dow.className = "dow"; dow.textContent = DOW_LABEL[d.getDay()];
    col.appendChild(track); col.appendChild(dow);
    weekChart.appendChild(col);
  });
}

function renderUnitList(){

    var row = document.createElement("label");

      '<span class="body">'+

        '<span class="meta"><span>全'+u.questions.length+'問</span>'+

          (wf.fresh>0 ? '<span>未挑戦 '+wf.fresh+'問</span>' : '')+
        '</span>'+
      '</span>';

      onSelectionChange();

    renderCatChips(ids[0]);

  var cats = CATS[unitId];
  var pool = getSelectedPool();
  catChips.innerHTML = "";
  Object.keys(cats).forEach(function(key){
    var count = pool.filter(function(q){return q.cat===key;}).length;
    if(count===0) return;
    var btn = document.createElement("button");
    btn.className = "chip"; btn.type = "button";
    btn.setAttribute("aria-pressed", activeCats.indexOf(key)>=0 ? "true":"false");
    btn.innerHTML = cats[key] + ' <span class="cnt">' + count + "</span>";
    btn.addEventListener("click", function(){
      var idx = activeCats.indexOf(key);
      if(idx>=0){ if(activeCats.length>1) activeCats.splice(idx,1); }
      else { activeCats.push(key); }
      renderCatChips(unitId);
    });
    catChips.appendChild(btn);
  });

function refreshWeakBadge(){
  var ids = getSelectedUnitIds();

============================================================ */
var quizQueue = [], quizIndex = 0, quizResults = [];
var currentChoices = [];

function beginQuiz(){
  var pool;
  if(useWeakOnly){
    pool = getSelectedPool();
    var n0 = Math.min(10, pool.length);
    quizQueue = KQHub.weightedSample(pool, function(q){ return fullKey(q.id); }, n0);
    quizIndex = 0;
    quizResults = [];
    screenHome.hidden = true;
    screenResult.hidden = true;
    screenQuiz.hidden = false;
    renderQuestion();
    return;
  } else {
    var basePool = getSelectedPool();
    var ids2 = getSelectedUnitIds();
    if(ids2.length===1 && activeCats.length){
      pool = basePool.filter(function(q){ return activeCats.indexOf(q.cat)>=0; });
    } else {
      pool = basePool;
    }
  }
  if(pool.length===0) pool = getSelectedPool();
  var n = Math.min(10, pool.length);
  quizQueue = pickN(pool, n);
  quizIndex = 0;
  quizResults = [];
  screenHome.hidden = true;
  screenResult.hidden = true;
  screenQuiz.hidden = false;
  renderQuestion();
}

function unitLabel(unitId){
  var u = UNITS.filter(function(x){return x.id===unitId;})[0];
  return u ? u.name : unitId;
}

function renderQuestion(){
  var q = quizQueue[quizIndex];
  answered = false;
  progressNum.textContent = (quizIndex+1)+"/"+quizQueue.length;
  progressFill.style.width = ((quizIndex)/quizQueue.length*100)+"%";
  qCatTag.textContent = (CATS[q._unit] && CATS[q._unit][q.cat]) || q.cat;
  qText.textContent = q.q;

  answerPanel.hidden = true;
  nextBtn.hidden = true;
  checkBtn.hidden = true;
  choiceGrid.hidden = true;
  choiceGrid.innerHTML = "";
  writeBox.hidden = true;
  qTableWrap.hidden = true;
  qTableWrap.innerHTML = "";
  qCircuitWrap.hidden = true;
  qCircuitWrap.innerHTML = "";

  if(q.table){
    qTableWrap.hidden = false;
    qTableWrap.innerHTML = renderTable(q.table);
  }
  if(q.type==="circuit"){
    qCircuitWrap.hidden = false;
    var row = document.createElement("div"); row.className = "circuit-row";
    q.circuits.forEach(function(c){
      var box = document.createElement("div"); box.className = "circuit-box";
      box.innerHTML = '<div class="circuit-label">'+(c.label||"")+'</div>' + generateCircuitSVG(c);
      row.appendChild(box);
    });
    qCircuitWrap.appendChild(row);
  }

  if(q.type==="pick" || q.type==="circuit"){
    choiceGrid.hidden = false;
    renderChoiceButtons(q.pick, function(choiceText, btnEl){
      onAnswerChosen(choiceText, btnEl);
    });
  } else if(q.type==="choice"){
    choiceGrid.hidden = false;
    currentChoices = buildChoiceOptions(q);
    renderChoiceButtons(currentChoices, function(choiceText, btnEl){
      onAnswerChosen(choiceText, btnEl);
    });
  } else {
    // text / num
    writeBox.hidden = false;
    checkBtn.hidden = false;
    writeInput.value = "";
    writeInput.readOnly = false;
    writeInput.inputMode = q.type==="num" ? "decimal" : "text";
    unitSuffix.hidden = !(q.type==="num" && q.unit);
    if(q.type==="num" && q.unit) unitSuffix.textContent = "単位（"+q.unit+"）はあってもなくても正解です";
    setTimeout(function(){ writeInput.focus(); scrollQuestionIntoView(); }, 50);
  }
}

function scrollQuestionIntoView(){
  var card = document.querySelector(".quiz-card");
  if(card && card.scrollIntoView) card.scrollIntoView({block:"start", behavior:"smooth"});
}

function renderChoiceButtons(options, onClick){
  var letters = ["A","B","C","D"];
  options.forEach(function(choiceText, i){
    var btn = document.createElement("button");
    btn.className = "choice-btn"; btn.type = "button";
    btn.innerHTML = '<span class="idx">'+letters[i]+'</span><span>'+choiceText+"</span>";
    btn.addEventListener("click", function(){ onClick(choiceText, btn); });
    choiceGrid.appendChild(btn);
  });
}

function onAnswerChosen(choiceText, btnEl){
  if(answered) return;
  answered = true;
  var q = quizQueue[quizIndex];
  var correct = choiceText === q.a;
  Array.from(choiceGrid.children).forEach(function(btn){
    btn.disabled = true;
    var txt = btn.querySelector("span:last-child").textContent;
    if(txt === q.a){ btn.classList.add("correct"); }
    else if(btn===btnEl){ btn.classList.add("wrong"); }
    else { btn.classList.add("dim"); }
  });
  finishQuestion(q, correct, choiceText);
}

checkBtn.addEventListener("click", function(){ submitWrittenAnswer(); });
writeInput.addEventListener("keydown", function(e){
  if(e.isComposing || e.keyCode===229) return;
  if(e.key==="Enter"){
    e.preventDefault();
    if(!answered) submitWrittenAnswer();
    else goNext();
  }
});
function submitWrittenAnswer(){
  if(answered) return;
  answered = true;
  var q = quizQueue[quizIndex];
  var userVal = writeInput.value;
  var correct = gradeAnswer(userVal, q);
  writeInput.readOnly = true;
  checkBtn.hidden = true;
  finishQuestion(q, correct, userVal);
}

function finishQuestion(q, correct, userAnswer){
  recordAnswer(q.id, correct);
  quizResults.push({ q:q, correct:correct, userAnswer: userAnswer===undefined?"":String(userAnswer) });
  progressFill.style.width = ((quizIndex+1)/quizQueue.length*100)+"%";

  answerPanel.hidden = false;
  answerPanel.className = "answer-panel " + (correct ? "ok":"ng");
  verdictText.textContent = correct ? "⭕ せいかい！" : "❌ ざんねん！";
  ansText.textContent = (q.type==="num" ? q.a + (q.unit||"") : q.a);

  var extra = (q.also && q.also.length) ? q.also : (q.alts && q.alts.length ? q.alts : null);
  if(extra){
    ansAlso.hidden = false;
    ansAlso.textContent = extra.join("・") + " でも正解です";
  } else {
    ansAlso.hidden = true;
  }
  if(q.exp){
    ansExp.hidden = false;
    ansExp.textContent = q.exp;
  } else {
    ansExp.hidden = true;
  }
  nextBtn.hidden = false;
}

nextBtn.addEventListener("click", goNext);
function goNext(){
  quizIndex++;
  if(quizIndex >= quizQueue.length) showResult();
  else renderQuestion();
}

quitBtn.addEventListener("click", function(){
  screenQuiz.hidden = true;
  screenHome.hidden = false;
  renderUnitList();
  onSelectionChange();
  refreshGlobalStats();
});

/* ============================================================
   RESULT
============================================================ */
function showResult(){
  screenQuiz.hidden = true;
  screenResult.hidden = false;

  var correctCount = quizResults.filter(function(r){return r.correct;}).length;
  resultScore.textContent = correctCount;

  var msgs;
  if(correctCount===quizResults.length) msgs = "パーフェクト！すごい！🎉";
  else if(correctCount>=quizResults.length*0.7) msgs = "よくできました！その調子！";
  else if(correctCount>=quizResults.length*0.4) msgs = "もう少し！にがてを復習しよう";
  else msgs = "だいじょうぶ、くり返せば覚えるよ";
  resultMsg.textContent = msgs;

  reviewList.innerHTML = "";
  quizResults.forEach(function(r){
    var div = document.createElement("div");
    div.className = "review-item " + (r.correct?"ok":"ng");
    var ansShown = (r.q.type==="num") ? r.q.a + (r.q.unit||"") : r.q.a;
    var extra = "";
    if(!r.correct && r.userAnswer) extra = '（あなたの答え：'+escapeHtml(r.userAnswer)+'）';
    div.innerHTML =
      '<span class="mark">'+(r.correct?"⭕":"❌")+'</span>'+
      '<span class="body">'+
        '<span class="q">'+escapeHtml(r.q.q)+'</span>'+
        '<span class="a">こたえ：<b>'+escapeHtml(String(ansShown))+'</b>'+extra+'</span>'+
      '</span>';
    reviewList.appendChild(div);
  });

  refreshWeakBadge();
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];
  });
}

retryBtn.addEventListener("click", function(){
  useWeakOnly = false;
  beginQuiz();
});
homeBtn.addEventListener("click", function(){
  screenResult.hidden = true;
  screenHome.hidden = false;
  renderUnitList();
  onSelectionChange();
  refreshGlobalStats();
});

/* ============================================================
   BOOT
============================================================ */
renderUnitList();
onSelectionChange();
refreshGlobalStats();

// 玄関からの「今日のおすすめ」ワンタップ起動
// ?start=weak&units=u01,u02 のように渡された場合、その回を選んで即にがて特訓を開始する
(function applyDeepLinkStart(){
  try{
    var params = { get: function(n){ return KQHub.getParam(n); } };
    if(params.get("start") !== "weak") return;
    var unitsParam = params.get("units");
    var ids = unitsParam ? unitsParam.split(",") : UNITS.map(function(u){ return u.id; });
    var found = false;
    UNITS.forEach(function(u){
      var on = ids.indexOf(u.id) >= 0;
      selectedUnits[u.id] = on;
      if(on) found = true;
    });
    if(!found) return;
    renderUnitList();
    onSelectionChange();
    useWeakOnly = true;
    beginQuiz();
  }catch(e){}
})();

})();
</script>
