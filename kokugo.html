<title>国語 ことばクイズ</title>
<style>

  }
  .question-text{ font-size:19px; font-weight:700; line-height:1.7; }

    cursor:pointer; font-family:inherit; display:flex; gap:10px; align-items:flex-start; line-height:1.5;
  }
  .choice-btn .idx{
    flex:none; width:24px; height:24px; border-radius:50%; background:var(--bg);
    display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:900;
    color:var(--ink-soft); margin-top:1px;
  }
  .choice-btn:disabled{ cursor:default; }
  .choice-btn.correct{ border-color:var(--ok); background:var(--ok-bg); color:var(--ok); }
  .choice-btn.correct .idx{ background:var(--ok); color:#fff; }
  .choice-btn.wrong{ border-color:var(--ng); background:var(--ng-bg); color:var(--ng); }

  .answer-panel.ng{ background:var(--ng-bg); border:2px solid var(--ng); }
  .answer-panel .verdict{ font-weight:900; font-size:15px; }
  .answer-panel.ok .verdict{ color:var(--ok); }
  .answer-panel.ng .verdict{ color:var(--ng); }

  .answer-panel .ans-item .lbl{ font-size:11px; color:var(--ink-soft); font-weight:700; }
  .answer-panel .ans-item .val{ font-size:19px; font-weight:900; }

    appearance:none; border:none; border-radius:14px; padding:16px;
    background:var(--accent); color:#fff; font-family:inherit;
    font-size:17px; font-weight:900; cursor:pointer; letter-spacing:.02em;
    box-shadow: 0 8px 18px -6px rgba(192,57,43,0.5);
  }
  .next-btn:active{ transform:translateY(1px); }

  .quit-link{ align-self:center; background:none; border:none; color:var(--ink-soft); font-size:12.5px; text-decoration:underline; cursor:pointer; font-family:inherit; padding:6px; }

  .score-hero{ text-align:center; display:flex; flex-direction:column; gap:6px; padding:6px 0 4px; }
  .score-big{ font-size:52px; font-weight:900; color:var(--red-deep); font-variant-numeric:tabular-nums; line-height:1; }
  .score-big span{ font-size:22px; color:var(--ink-soft); font-weight:700; }
  .score-msg{ font-size:14px; color:var(--ink-soft); }

  .review-list{ display:flex; flex-direction:column; gap:8px; }
  .review-item{ display:flex; gap:10px; align-items:flex-start; border:1px solid var(--line); border-radius:12px; padding:10px 12px; background:var(--bg); }
  .review-item .mark{ flex:none; font-weight:900; font-size:15px; margin-top:1px; }
  .review-item.ok .mark{ color:var(--ok); }
  .review-item.ng .mark{ color:var(--ng); }
  .review-item .body{ display:flex; flex-direction:column; gap:2px; }
  .review-item .q{ font-size:13.5px; font-weight:700; line-height:1.5; }
  .review-item .a{ font-size:13px; color:var(--ink-soft); }
  .review-item .a b{ color:var(--ink); }

  .result-actions{ display:flex; flex-direction:column; gap:10px; }
  .secondary-btn{ appearance:none; border:2px solid var(--line); background:var(--paper); color:var(--ink); border-radius:14px; padding:13px; font-size:14.5px; font-weight:900; cursor:pointer; font-family:inherit; }

  [hidden]{ display:none !important; }
  .foot-note{ text-align:center; font-size:11px; color:var(--ink-soft); padding-top:4px; }

  .back-link{ align-self:flex-start; background:none; border:none; color:var(--ink-soft); font-size:12.5px; text-decoration:underline; cursor:pointer; font-family:inherit; padding:2px 0 0; display:flex; align-items:center; gap:2px; }
  .unit-grid{ display:flex; flex-direction:column; gap:10px; }
  .unit-card{
    appearance:none; width:100%; text-align:left; border:2px solid var(--line);
    background:var(--paper); border-radius:16px; padding:14px 16px; cursor:pointer;
    font-family:inherit; color:var(--ink); display:flex; align-items:center; gap:12px;
  }
  .unit-card .emoji{ font-size:26px; flex:none; }
  .unit-card .body{ flex:1; min-width:0; }
  .unit-card .round-tag{ display:block; font-size:10.5px; font-weight:800; color:var(--ink-soft); letter-spacing:.04em; margin-bottom:1px; }
  .unit-card .name{ font-weight:900; font-size:16px; }
  .unit-card .meta{ font-size:12px; color:var(--ink-soft); margin-top:2px; display:flex; gap:8px; flex-wrap:wrap; }
  .unit-card .meta .weak-flag{ color:var(--accent-deep); font-weight:700; }
  .unit-card .chevron{ flex:none; color:var(--ink-soft); font-size:18px; }
  .unit-card:disabled{ opacity:.45; cursor:not-allowed; }

  .unit-list{ display:flex; flex-direction:column; gap:10px; }

  .row-actions{ display:flex; gap:10px; }
  .link-btn{ appearance:none; background:none; border:none; color:var(--accent-deep); font-weight:700; font-size:13px; text-decoration:underline; cursor:pointer; font-family:inherit; padding:4px 0; }

    <div class="card quiz-card">
      <span class="cat-tag" id="qCatTag">意味→ことば</span>

  <!-- ===================== RESULT ===================== -->
  <section id="screen-result" hidden>

    </div>
  </section>

</div>

/* ============================================================
   STATE / STORAGE（きろくは common.js の KQHub に一本化）
============================================================ */
var SUBJECT = "kokugo";
function fullKey(id){ return SUBJECT + ":" + id; }

/* ---- 日付まわりのヘルパー ---- */
function pad2(n){ return n<10 ? "0"+n : ""+n; }
function dateKey(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function todayKey(){ return dateKey(new Date()); }
function last7Days(){
  var out = [];
  var now = new Date();
  for(var i=6;i>=0;i--){
    var d = new Date(now);
    d.setDate(now.getDate()-i);
    out.push(d);
  }
  return out;
}
function thisWeekTotals(){
  var now = new Date();
  var day = now.getDay();
  var diffToMonday = (day===0) ? -6 : (1-day);
  var monday = new Date(now);
  monday.setDate(now.getDate()+diffToMonday);
  var total=0, correct=0;
  for(var i=0;i<7;i++){
    var d = new Date(monday);
    d.setDate(monday.getDate()+i);
    if(d > now) break;
    var e = KQHub.getStatsFor(d, SUBJECT);
    total+=e.total; correct+=e.correct;
  }
  return { total:total, correct:correct };
}
function recordAnswer(unitId, id, correct){
  KQHub.recordAnswer(SUBJECT, fullKey(id), correct);
}
function weakCount(unitId, questions){
  return KQHub.countWeakFresh(questions.map(function(q){ return fullKey(q.id); }));
}

/* ============================================================
   HELPERS
============================================================ */
function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function pickN(arr, n){ return shuffle(arr).slice(0, n); }

function uniqueAnswers(list){
  var out = [], seen = {};
  list.forEach(function(q){
    if(!seen[q.a]){ seen[q.a]=true; out.push(q.a); }
  });
  return out;
}

function buildChoices(question, unit){
  if(question.choices && question.choices.length){
    return shuffle(question.choices);
  }
  var pool = unit.questions.filter(function(q){
    return q.type==="choice" && q.group===question.group && q.a!==question.a;
  });
  var distractors = pickN(uniqueAnswers(pool), 3);
  return shuffle(distractors.concat([question.a]));
}

/* ---- 採点（ゆるめ）: 全角/半角をそろえ、カタカナ→ひらがな、空白・句読点を除去して比較 ---- */
function normalizeAnswer(s){
  if(!s) return "";
  s = String(s).normalize("NFKC");
  s = s.replace(/[ァ-ヶ]/g, function(ch){
    return String.fromCharCode(ch.charCodeAt(0) - 0x60);
  });
  s = s.replace(/[\s　。、,，.．「」『』・！？!?\-ー]/g, "");
  return s;
}
function isCorrectInput(q, userVal){
  var norm = normalizeAnswer(userVal);
  if(!norm) return false;
  var candidates = [q.a].concat(q.alts||[]).map(normalizeAnswer);
  return candidates.indexOf(norm) >= 0;
}

   DOM REFS
============================================================ */
var $ = function(id){ return document.getElementById(id); };

var screenUnits = $("screen-units");
var screenQuiz = $("screen-quiz");
var screenResult = $("screen-result");

var statToday = $("statToday");
var statWeek = $("statWeek");
var weekChart = $("weekChart");

var unitList = $("unitList");
var selectAllBtn = $("selectAllBtn");
var selectNoneBtn = $("selectNoneBtn");
var catCard2 = $("catCard2");
var catChips2 = $("catChips2");
var multiTotalCount = $("multiTotalCount");
var multiStartBtn = $("multiStartBtn");
var multiWeakBtn = $("multiWeakBtn");
var multiWeakBadge = $("multiWeakBadge");

var progressFill = $("progressFill");
var progressNum = $("progressNum");
var qCatTag = $("qCatTag");
var qText = $("qText");
var choiceGrid = $("choiceGrid");
var writeBox = $("writeBox");
var writeInput = $("writeInput");
var answerPanel = $("answerPanel");
var verdictText = $("verdictText");

/* ============================================================
   回をえらぶ（1回だけ選べば単元別、複数選べば組分け・カリキュラム対策）
============================================================ */
var currentUnit = null;
var useWeakOnly = false;
var lastWeakOnly = false;
var selectedUnits = {};   // unitId -> bool
var multiActiveCats = []; // 1回だけ選択時のみ使用

function renderUnitList(){
  unitList.innerHTML = "";
  var weakSummary = {};
  UNITS.forEach(function(u){
    var wf = weakCount(u.id, u.questions);
    var w = wf.weak;
    weakSummary[u.id] = w;
    var row = document.createElement("label");
    row.className = "unit-row";
    row.innerHTML =
      '<input type="checkbox" data-unit="'+u.id+'">'+
      '<span class="body">'+
        (u.round ? '<span class="round-tag">'+u.round+'</span>' : '')+
        '<span class="name">'+u.name+'</span>'+
        '<span class="meta"><span>全'+u.questions.length+'問</span>'+
          (w>0 ? '<span class="weak-flag">にがて '+w+'問</span>' : '')+
          (wf.fresh>0 ? '<span>未挑戦 '+wf.fresh+'問</span>' : '')+
        '</span>'+
      '</span>';
    var cb = row.querySelector("input");
    cb.checked = !!selectedUnits[u.id];
    cb.addEventListener("change", function(){
      selectedUnits[u.id] = cb.checked;
      onMultiSelectionChange();
    });
    unitList.appendChild(row);
  });
  // 玄関（index.html）が「今日のおすすめ」を出すときに参照する軽いキャッシュ
  try{ localStorage.setItem("kq-kokugo-weak-summary-v1", JSON.stringify(weakSummary)); }catch(e){}
}

function getSelectedUnitIds(){
  return UNITS.filter(function(u){ return selectedUnits[u.id]; }).map(function(u){ return u.id; });
}

// 選択中の回の全問題を、出典の回IDとカテゴリ表示名をタグ付けして結合する
function getSelectedPool(){
  var ids = getSelectedUnitIds();
  var pool = [];
  UNITS.forEach(function(u){
    if(ids.indexOf(u.id)<0) return;
    u.questions.forEach(function(q){
      var clone = Object.assign({}, q);
      clone.__unitId = u.id;
      clone.__catLabel = u.cats[q.cat];
      pool.push(clone);
    });
  });
  return pool;
}

function updateMultiTotalCount(){
  var ids = getSelectedUnitIds();
  var pool = getSelectedPool();
  if(ids.length===1 && multiActiveCats.length){
    pool = pool.filter(function(q){ return multiActiveCats.indexOf(q.cat)>=0; });
  }
  multiTotalCount.textContent = pool.length;
}

function onMultiSelectionChange(){
  var ids = getSelectedUnitIds();
  multiStartBtn.disabled = ids.length===0;
  multiActiveCats = [];
  if(ids.length===1){
    var unit = UNITS.filter(function(u){ return u.id===ids[0]; })[0];
    catCard2.hidden = false;
    multiActiveCats = Object.keys(unit.cats);
    renderCatChips2(ids[0]);
  } else {
    catCard2.hidden = true;
  }
  updateMultiTotalCount();
  updateMultiWeakBadge();
}

// えらんだ回のうち、にがてスコアが低い（0以下の）問題数をカウントする（表示用）
function selectedWeakCount(){
  var ids = getSelectedUnitIds();
  var n = {weak:0, fresh:0};
  UNITS.forEach(function(u){
    if(ids.indexOf(u.id)<0) return;
    var c = weakCount(u.id, u.questions);
    n.weak += c.weak; n.fresh += c.fresh;
  });
  return n;
}

function updateMultiWeakBadge(){
  var ids = getSelectedUnitIds();
  var w = selectedWeakCount();
  multiWeakBadge.textContent = "にがて"+w.weak+"問・未挑戦"+w.fresh+"問";
  multiWeakBtn.disabled = ids.length===0;
}

function renderCatChips2(unitId){
  var unit = UNITS.filter(function(u){ return u.id===unitId; })[0];
  var cats = unit.cats;
  var pool = getSelectedPool();
  catChips2.innerHTML = "";
  Object.keys(cats).forEach(function(key){
    var count = pool.filter(function(q){return q.cat===key;}).length;
    if(count===0) return;
    var btn = document.createElement("button");
    btn.className = "chip";
    btn.type = "button";
    btn.setAttribute("aria-pressed", multiActiveCats.indexOf(key)>=0 ? "true":"false");
    btn.innerHTML = cats[key] + ' <span class="cnt">' + count + "</span>";
    btn.addEventListener("click", function(){
      var idx = multiActiveCats.indexOf(key);
      if(idx>=0){
        if(multiActiveCats.length>1) multiActiveCats.splice(idx,1);
      } else {
        multiActiveCats.push(key);
      }
      renderCatChips2(unitId);
      updateMultiTotalCount();
      updateMultiWeakBadge();
    });
    catChips2.appendChild(btn);
  });
}

selectAllBtn.addEventListener("click", function(){
  UNITS.forEach(function(u){ selectedUnits[u.id] = true; });
  renderUnitList();
  onMultiSelectionChange();
});
selectNoneBtn.addEventListener("click", function(){
  UNITS.forEach(function(u){ selectedUnits[u.id] = false; });
  renderUnitList();
  onMultiSelectionChange();
});

function beginMixedQuiz(weakOnly){
  var ids = getSelectedUnitIds();
  if(ids.length===0) return;
  var basePool = getSelectedPool();
  lastWeakOnly = !!weakOnly;
  useWeakOnly = !!weakOnly;
  // buildChoices が同じ問題プールの中から選択肢を探せるよう、結合プールを持つ仮想ユニットにする
  currentUnit = { id:"__mixed__", name:"まとめて練習", round:null, cats:null, questions: basePool };
  var n = Math.min(10, basePool.length);
  if(weakOnly){
    // にがて特訓：スコアが低い問題ほど出やすい重み付き抽選（ゼロにはしない）
    quizQueue = KQHub.weightedSample(basePool, function(q){ return fullKey(q.id); }, n);
  } else {
    var pool = (ids.length===1 && multiActiveCats.length)
      ? basePool.filter(function(q){ return multiActiveCats.indexOf(q.cat)>=0; })
      : basePool;
    if(pool.length===0) return;
    n = Math.min(10, pool.length);
    quizQueue = pickN(pool, n);
  }
  if(quizQueue.length===0) return;
  quizIndex = 0;
  quizResults = [];
  screenUnits.hidden = true;
  screenResult.hidden = true;
  screenQuiz.hidden = false;
  renderQuestion();
}

multiStartBtn.addEventListener("click", function(){
  if(multiStartBtn.disabled) return;
  beginMixedQuiz(false);
});
multiWeakBtn.addEventListener("click", function(){
  if(multiWeakBtn.disabled) return;
  beginMixedQuiz(true);
});

var DOW_LABEL = ["日","月","火","水","木","金","土"];

function refreshGlobalStats(){
  var todayEntry = KQHub.getStatsFor(new Date(), SUBJECT);
  statToday.textContent = todayEntry.correct + "/" + todayEntry.total;
  var week = thisWeekTotals();
  statWeek.textContent = week.correct + "/" + week.total;

  var days = last7Days();
  var todayStr = todayKey();
  var maxTotal = 1;
  days.forEach(function(d){
    var e = KQHub.getStatsFor(d, SUBJECT);
    if(e && e.total > maxTotal) maxTotal = e.total;
  });
  weekChart.innerHTML = "";
  days.forEach(function(d){
    var key = dateKey(d);
    var e = KQHub.getStatsFor(d, SUBJECT);
    var isToday = key === todayStr;
    var pct = e.total>0 ? Math.max(10, Math.round(e.total/maxTotal*100)) : 0;

    var col = document.createElement("div");
    col.className = "col" + (isToday ? " today" : "");

    var track = document.createElement("div");
    track.className = "bar-track";
    var fill = document.createElement("div");
    fill.className = "bar-fill" + (e.total>0 ? (isToday ? " today" : " has-data") : "");
    fill.style.height = pct + "%";
    fill.title = key + "：" + e.correct + "/" + e.total + "問正解";
    track.appendChild(fill);

    var dow = document.createElement("div");
    dow.className = "dow";
    dow.textContent = DOW_LABEL[d.getDay()];

    col.appendChild(track);
    col.appendChild(dow);
    weekChart.appendChild(col);
  });
}

/* ============================================================
   QUIZ FLOW
============================================================ */
var quizQueue = [];
var quizIndex = 0;
var quizResults = [];
var answered = false; // このもんだいをすでに答え合わせしたか

function renderQuestion(){
  var q = quizQueue[quizIndex];
  answered = false;
  progressNum.textContent = (quizIndex+1)+"/"+quizQueue.length;
  progressFill.style.width = ((quizIndex)/quizQueue.length*100)+"%";
  qCatTag.textContent = q.__catLabel || currentUnit.cats[q.cat];
  qText.innerHTML = String(q.q).replace(/\n/g, "<br>");

  answerPanel.hidden = true;
  userAnsItem.hidden = true;
  nextBtn.hidden = true;

  if(q.type==="choice"){
    choiceGrid.hidden = false;
    writeBox.hidden = true;
    var currentChoices = buildChoices(q, currentUnit);
    choiceGrid.innerHTML = "";
    var letters = ["A","B","C","D"];
    currentChoices.forEach(function(choiceText, i){
      var btn = document.createElement("button");
      btn.className = "choice-btn";
      btn.type = "button";
      btn.innerHTML = '<span class="idx">'+letters[i]+'</span><span>'+choiceText+"</span>";
      btn.addEventListener("click", function(){ onChoiceSelected(q, choiceText, btn); });
      choiceGrid.appendChild(btn);
    });
  } else {
    choiceGrid.hidden = true;
    writeBox.hidden = false;
    writeInput.value = "";
    writeInput.disabled = false;
    setTimeout(function(){
      writeInput.focus();
      if(typeof writeInput.scrollIntoView === "function"){
        writeInput.scrollIntoView({block:"center", behavior:"smooth"});
      }
    }, 50);
  }
}

function onChoiceSelected(q, choiceText, btnEl){
  if(answered) return;
  answered = true;
  var correct = choiceText === q.a;
  Array.from(choiceGrid.children).forEach(function(btn){
    btn.disabled = true;
    var txt = btn.querySelector("span:last-child").textContent;
    if(txt === q.a){ btn.classList.add("correct"); }
    else if(btn===btnEl){ btn.classList.add("wrong"); }
    else { btn.classList.add("dim"); }
  });
  showAnswer(q, correct, choiceText);
  finishQuestion(q, correct, choiceText);
  nextBtn.hidden = false;
}

writeInput.addEventListener("keydown", function(e){
  if(e.isComposing || e.keyCode===229) return; // 変換中のEnterは無視
  if(e.key !== "Enter") return;
  e.preventDefault();
  var q = quizQueue[quizIndex];
  if(!answered){
    answered = true;
    writeInput.disabled = true;
    var val = writeInput.value;
    var correct = isCorrectInput(q, val);
    showAnswer(q, correct, val, true);
    finishQuestion(q, correct, val);
    nextBtn.hidden = false;
  } else {
    advance();
  }
});

nextBtn.addEventListener("click", function(){
  advance();
});

function showAnswer(q, correct, userVal, showUser){
  answerPanel.hidden = false;
  answerPanel.className = "answer-panel " + (correct ? "ok":"ng");
  verdictText.textContent = correct ? "⭕ せいかい！" : "❌ ざんねん！";
  ansVal.textContent = q.a;
  if(showUser){
    userAnsItem.hidden = false;
    userAnsVal.textContent = userVal || "（無回答）";
  } else {
    userAnsItem.hidden = true;
  }
}

function finishQuestion(q, correct, userAnswer){
  recordAnswer(q.__unitId || currentUnit.id, q.id, correct);
  quizResults.push({ q:q, correct:correct, userAnswer:userAnswer||"" });
  progressFill.style.width = ((quizIndex+1)/quizQueue.length*100)+"%";
}

function advance(){
  quizIndex++;
  if(quizIndex >= quizQueue.length){
    showResult();
  } else {
    renderQuestion();
  }
}

quitBtn.addEventListener("click", function(){
  screenQuiz.hidden = true;
  screenUnits.hidden = false;
  renderUnitList();
  onMultiSelectionChange();
  refreshGlobalStats();
});

/* ============================================================
   RESULT
============================================================ */
function showResult(){
  screenQuiz.hidden = true;
  screenResult.hidden = false;

  var correctCount = quizResults.filter(function(r){return r.correct;}).length;
  resultScore.textContent = correctCount;
  resultTotalLabel.textContent = "/"+quizResults.length+"問 正解";

  var msgs;
  if(correctCount===quizResults.length) msgs = "パーフェクト！すごい！🎉";
  else if(correctCount>=quizResults.length*0.7) msgs = "よくできました！その調子！";
  else if(correctCount>=quizResults.length*0.4) msgs = "もう少し！にがてを復習しよう";
  else msgs = "だいじょうぶ、くり返せば覚えるよ";
  resultMsg.textContent = msgs;

  reviewList.innerHTML = "";
  quizResults.forEach(function(r){
    var div = document.createElement("div");
    div.className = "review-item " + (r.correct?"ok":"ng");
    var qHtml = String(r.q.q).replace(/\n.*$/s, "").replace(/<u>|<\/u>/g, "");
    var aLine = "こたえ：<b>"+r.q.a+"</b>";
    if(!r.correct && r.q.type==="input" && r.userAnswer){
      aLine += "　／　あなたの答え：" + r.userAnswer;
    }
    div.innerHTML =
      '<span class="mark">'+(r.correct?"⭕":"❌")+'</span>'+
      '<span class="body">'+
        '<span class="q">'+qHtml+'</span>'+
        '<span class="a">'+aLine+'</span>'+
      '</span>';
    reviewList.appendChild(div);
  });
}

retryBtn.addEventListener("click", function(){
  beginMixedQuiz(lastWeakOnly);
});
homeBtn.addEventListener("click", function(){
  screenResult.hidden = true;
  screenUnits.hidden = false;
  renderUnitList();
  onMultiSelectionChange();
  refreshGlobalStats();
});

/* ============================================================
   BOOT
============================================================ */
renderUnitList();
onMultiSelectionChange();
refreshGlobalStats();

// 玄関からの「今日のおすすめ」ワンタップ起動
// ?start=weak&units=wago1,kanyoku1 のように渡された場合、その回を選んで即にがて特訓を開始する
(function applyDeepLinkStart(){
  try{
    var params = { get: function(n){ return KQHub.getParam(n); } };
    if(params.get("start") !== "weak") return;
    var unitsParam = params.get("units");
    var ids = unitsParam ? unitsParam.split(",") : UNITS.map(function(u){ return u.id; });
    var found = false;
    UNITS.forEach(function(u){
      var on = ids.indexOf(u.id) >= 0;
      selectedUnits[u.id] = on;
      if(on) found = true;
    });
    if(!found) return;
    renderUnitList();
    onMultiSelectionChange();
    beginMixedQuiz(true);
  }catch(e){}
})();

})();
</script>
